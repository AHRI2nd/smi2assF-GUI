name: CI checks

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Set up Python 3.14
        uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Install virtual display
        run: sudo apt-get update && sudo apt-get install -y xvfb xauth

      - name: Run tests
        run: xvfb-run -a python -m pytest -q

  windows-runtime:
    name: Windows Python ${{ matrix.python-version }} ${{ matrix.python-architecture }} candidate
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: '3.13.13'
            python-minor: '3.13'
            runner: windows-latest
            python-architecture: x64
          - python-version: '3.14.8'
            python-minor: '3.14'
            runner: windows-latest
            python-architecture: x64
          - python-version: '3.14.8'
            python-minor: '3.14'
            runner: windows-11-arm
            python-architecture: arm64
    runs-on: ${{ matrix.runner }}
    env:
      PYTHON: python
      BUILD_PYTHON_VERSION: ${{ matrix.python-minor }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
      - name: Set up candidate runtime
        uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          architecture: ${{ matrix.python-architecture }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Prepare the requested runtime
        shell: bash
        run: bash install.sh
      - name: Verify tests, EXE and installer lifecycle
        shell: bash
        run: bash build.sh
      - name: Preserve candidate installer diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: windows-${{ matrix.python-version }}-${{ matrix.python-architecture }}-installer-diagnostics
          path: build/installer-smoke-logs/
          if-no-files-found: ignore
